baseURL = "/"
title = "water park"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

# The desk is a static page that talks to a Fountain teammate, so it ships
# with the site rather than as a second deploy. Its source stays in desk/,
# beside the prompt and the manifest it belongs with, and lands at /desk/.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "desk"
    target = "static/desk"

[params]
  description = "Short lessons on running an agent against real infrastructure safely, on Fountain, themed on the Accessible Ops properties."
  tagline = "Courses on Fountain and the propose loop, applied to org IAM."
  github = "https://github.com/INTENTIUS/waterpark"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]
