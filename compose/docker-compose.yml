# water park, one shot. Fountain + Postgres + Floci, and a containerized
# Fountain runner so conversations need no sprites.dev token.
#
#   cp .env.example .env        (or: just up, which does this and generates the keys)
#   docker compose up -d
#   bin/register.sh you@example.com 'password'     registers, logs the CLI in, writes FOUNTAIN_API_KEY
#   docker compose --profile runner up -d          starts the runner with that key
#
# Fountain  http://localhost:${PORT:-4000}     Floci  http://localhost:${FLOCI_PORT:-4566}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: fountain
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fountain"]
      interval: 5s
      timeout: 3s
      retries: 20

  fountain:
    image: ghcr.io/binarybourbon/fountain:${FOUNTAIN_IMAGE_TAG:-sha-7f8d16af5100e8a671039fd254543a95e728a40e}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    environment:
      PHX_SERVER: "true"
      PORT: "4000"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/fountain
      DATABASE_SSL: "false"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${PORT:-4000}}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?run bin/env.sh or just up to generate .env}
      MASTER_SECRETS_KEY: ${MASTER_SECRETS_KEY:?run bin/env.sh or just up to generate .env}
      # accounts self-verify and the first one is admin (ADR 0011). a class instance, not a public one
      EMAIL_DELIVERY: none
      FIRST_USER_ADMIN: "true"
      # sandboxes on the runner service below. no vendor account. trusted mode, see README
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-runner}
      SANDBOX_RUNNERS_ENABLED: "true"
      SPRITES_TOKEN: ${SPRITES_TOKEN:-}
      # the sandbox lifecycle bounds (ADR 0017). Fountain's own defaults are 60 minutes idle and
      # 24 hours lifetime. the class default parks an idle sandbox after 2 minutes so lesson 2 can
      # watch it happen. a parked sandbox keeps its disk and wakes on the next prompt
      SANDBOX_IDLE_TIMEOUT_MINUTES: ${SANDBOX_IDLE_TIMEOUT_MINUTES:-2}
      SANDBOX_MAX_LIFETIME_HOURS: ${SANDBOX_MAX_LIFETIME_HOURS:-24}
      BILLING_ENABLED: "false"
      # The AWS desk is a page on another origin, so it calls this API with a
      # bearer key and no cookie. Two settings make that possible. CORS admits
      # the origin the page is served from, and OAUTH_CLIENTS names the client
      # that "Sign in with Fountain" hands a key to, with its redirect exact.
      # 1313 is just serve, 8080 is just docker-run.
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:1313,http://localhost:8080}
      OAUTH_CLIENTS: '[{"id":"aws-desk","name":"The AWS desk","redirect_uris":["http://localhost:1313/desk/","http://localhost:8080/desk/"]}]'
    healthcheck:
      # the release image has bash but no curl or wget. a TCP connect is enough for "up"
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/4000"]
      interval: 5s
      timeout: 3s
      retries: 40

  floci:
    # a patched build from the lex00/floci fork. upstream 2.0.1 never returns a role's
    # permissions boundary on read and never populates iam:PermissionsBoundary, so
    # bounded roles replan forever and lesson 8's double refusal denies both ways.
    # branch fix/iam-permissions-boundary. set FLOCI_IMAGE=floci/floci FLOCI_IMAGE_TAG=latest for upstream
    image: ${FLOCI_IMAGE:-ghcr.io/lex00/floci}:${FLOCI_IMAGE_TAG:-iam-boundary}
    ports:
      - "${FLOCI_PORT:-4566}:4566"
    environment:
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: ${FLOCI_IAM_ENFORCEMENT:-false}

  # the sandbox provider. one container, the student's sandboxes are directories in it.
  # needs FOUNTAIN_API_KEY in .env, which bin/register.sh writes. start with --profile runner
  runner:
    image: ghcr.io/intentius/waterpark-runner:${RUNNER_IMAGE_TAG:-latest}
    build: ./runner
    profiles: ["runner"]
    depends_on:
      fountain:
        condition: service_healthy
    environment:
      FOUNTAIN_BASE_URL: http://fountain:4000
      FOUNTAIN_API_KEY: ${FOUNTAIN_API_KEY:-}
      RUNNER_NAME: ${RUNNER_NAME:-waterpark}
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - sandboxes:/sandboxes
    command: ["sh", "-c", "[ -n \"$FOUNTAIN_API_KEY\" ] || { echo 'FOUNTAIN_API_KEY is empty. run bin/register.sh first' >&2; exit 1; }; exec fountain runner --name \"$RUNNER_NAME\" --root /sandboxes"]
    restart: unless-stopped

volumes:
  pgdata:
  sandboxes:
